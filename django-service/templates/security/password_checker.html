{% extends "base.html" %}
{% load static %}
{% block title %}Password Checker | CyberShield X{% endblock %}
{% block content %}
<h2 class="mb-1">Password Strength Checker</h2>
<p class="text-body-secondary mb-4">
    Scored instantly in your browser - nothing you type here is sent anywhere.
</p>

<div class="card border-secondary-subtle" style="max-width: 480px;">
    <div class="card-body">
        <label class="form-label">Password</label>
        <div class="input-group mb-3">
            <input type="password" id="pwd-input" class="form-control" placeholder="Type a password to test" autocomplete="off">
            <button class="btn btn-outline-secondary" type="button" id="pwd-toggle">Show</button>
        </div>

        <div class="progress mb-2" style="height: 8px;">
            <div id="pwd-bar" class="progress-bar" role="progressbar" style="width: 0%;"></div>
        </div>
        <div id="pwd-label" class="fw-semibold mb-3">Enter a password above</div>

        <ul id="pwd-feedback" class="small text-body-secondary mb-0 ps-3"></ul>
    </div>
</div>

<script src="{% static 'js/password-strength.js' %}"></script>
{% endblock %}
