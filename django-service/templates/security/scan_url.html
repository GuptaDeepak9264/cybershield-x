{% extends "base.html" %}
{% block title %}Scan a URL | CyberShield X{% endblock %}
{% block content %}
<h2 class="mb-1">Scan a URL</h2>
<p class="text-body-secondary mb-4">Check a link before you click it.</p>
<div class="card border-secondary-subtle" style="max-width: 480px;">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                {{ form.url }}
                {% for error in form.url.errors %}
                    <div class="text-danger small mt-1">{{ error }}</div>
                {% endfor %}
            </div>
            <button type="submit" class="btn btn-info w-100">Queue Scan</button>
        </form>
    </div>
</div>
{% endblock %}
