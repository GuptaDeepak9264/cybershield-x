{% extends "base.html" %}
{% block title %}Login | CyberShield X{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card border-secondary-subtle shadow-sm">
            <div class="card-body p-4">
                <h4 class="card-title mb-4">Sign in</h4>
                <form method="post" novalidate>
                    {% csrf_token %}
                    {% if form.non_field_errors %}
                        <div class="alert alert-danger py-2">{{ form.non_field_errors }}</div>
                    {% endif %}
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        {{ form.username }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        {{ form.password }}
                    </div>
                    <button type="submit" class="btn btn-info w-100">Log in</button>
                </form>
                <p class="text-body-secondary small mt-3 mb-0">
                    No account? <a href="{% url 'accounts:register' %}">Register</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
