{% extends "base.html" %}
{% block title %}Send Notification | CyberShield X{% endblock %}
{% block content %}
<h2 class="mb-4">Send Notification</h2>
<div class="card border-secondary-subtle" style="max-width: 520px;">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <div class="mb-3">
                    <label class="form-label">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}
                        <div class="text-danger small mt-1">{{ error }}</div>
                    {% endfor %}
                </div>
            {% endfor %}
            <button type="submit" class="btn btn-info w-100">Send</button>
        </form>
    </div>
</div>
{% endblock %}
