# Render Blueprint - deploys all three services from this monorepo in one
# shot: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: cybershield-x-django
    runtime: python
    rootDir: django-service
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        sync: false  # e.g. cybershield-x-django.onrender.com
      - key: DB_ENGINE
        value: mysql
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: JWT_SECRET
        sync: false  # must match fastapi/flask services exactly
      - key: JWT_EXPIRATION_MINUTES
        value: "60"
      - key: FASTAPI_BASE_URL
        sync: false  # e.g. https://cybershield-x-fastapi.onrender.com
      - key: FLASK_BASE_URL
        sync: false  # e.g. https://cybershield-x-flask.onrender.com
      - key: INTEGRATION_TIMEOUT_SECONDS
        value: "10"
      - key: USE_S3
        value: "True"
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_REGION_NAME
        value: us-east-1
      - key: AWS_S3_ENDPOINT_URL
        sync: false  # leave unset for real AWS S3
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      - key: CSRF_TRUSTED_ORIGINS
        sync: false  # e.g. https://cybershield-x-django.onrender.com
      - key: TIME_ZONE
        value: UTC

  - type: web
    name: cybershield-x-fastapi
    runtime: python
    rootDir: fastapi-service
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT"
    envVars:
      - key: DB_ENGINE
        value: mysql
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: JWT_SECRET
        sync: false  # must match django/flask services exactly
      - key: OPENAI_API_KEY
        sync: false  # optional - leave unset to run the assistant in fallback mode
      - key: CORS_ALLOWED_ORIGINS
        sync: false  # e.g. https://cybershield-x-django.onrender.com

  - type: web
    name: cybershield-x-flask
    runtime: python
    rootDir: flask-service
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn run:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: DB_ENGINE
        value: mysql
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: JWT_SECRET
        sync: false  # must match django/fastapi services exactly
      - key: USE_S3
        value: "True"
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_REGION_NAME
        value: us-east-1
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: SMTP_HOST
        sync: false  # optional - leave unset to run email in console/log fallback mode
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_USE_TLS
        value: "True"
      - key: EMAIL_FROM
        value: no-reply@cybershieldx.local